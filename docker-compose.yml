services:

  database:
    image: postgres:16
    container_name: employee-db

    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: employee_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U employee_user -d employee_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: employee-backend

    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: employee_db
      DB_USER: employee_user
      DB_PASSWORD: employee_password

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: employee-frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data:
